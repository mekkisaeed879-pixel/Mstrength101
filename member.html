<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>My programme | MStrength101</title><style>body{margin:0;background:#101114;color:white;font:16px/1.55 system-ui}header,main{max-width:830px;margin:auto;padding:28px}header{border-bottom:1px solid #444;display:flex;justify-content:space-between;align-items:center}a{color:#ff7373}.brand{font-size:1.4rem;font-weight:800;text-decoration:none}h1{font-size:clamp(2rem,5vw,3.2rem)}.card{background:#1b1d22;border:1px solid #41434c;padding:25px;border-radius:14px;margin:20px 0}input,button{font:inherit;border-radius:7px;padding:11px 14px}input{background:#101114;color:white;border:1px solid #777;width:100%;box-sizing:border-box;margin:8px 0 15px}button{background:#db3333;color:white;border:0;cursor:pointer;font-weight:750}button:disabled{opacity:.6;cursor:wait}.muted{color:#bec0c6}.hide{display:none}#message{white-space:pre-line}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}</style></head><body><header><a class="brand" href="./index.html">MStrength101</a><a href="./index.html">Home</a></header><main><h1>Your Combat Strength Package</h1><p class="muted">Sign in to access programmes you've purchased, check training progress and download your PDF.</p><div id="message" role="status" aria-live="polite"></div><section class="card" id="login"><h2>Secure member sign-in</h2><form id="signIn"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><button id="emailButton">Email me a sign-in link</button></form><p class="muted">We'll send a secure login link. No password is needed.</p></section><section id="member" class="card hide"><h2>My library</h2><p id="ownership" class="muted"></p><div id="actions" class="hide"><button id="download">Download my PDF</button></div><div id="buy" class="hide"><p>You haven't purchased this programme on this account.</p><button id="checkout">Purchase Combat Strength Package</button></div><p><button id="logout" type="button">Sign out</button></p></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const msg=document.getElementById('message');let sb,config,session;
function status(t){msg.textContent=t}
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'authorization':'Bearer '+session.access_token,...(options.headers||{})}});const body=await r.json().catch(()=>({}));if(!r.ok)throw Error(body.error||'Request failed ('+r.status+')');return body}
try{const r=await fetch('/api/public-config');config=await r.json();if(!r.ok||!config.supabaseUrl||!config.supabaseAnonKey)throw Error('Customer login is not configured yet. Please check back soon.');sb=createClient(config.supabaseUrl,config.supabaseAnonKey,{auth:{flowType:'pkce',detectSessionInUrl:true}});const {data}=await sb.auth.getSession();session=data.session;await render();sb.auth.onAuthStateChange((_event,newSession)=>{session=newSession;queueMicrotask(()=>render())})}catch(e){status(e.message);document.getElementById('emailButton').disabled=true}
async function render(){document.getElementById('login').classList.toggle('hide',!!session);document.getElementById('member').classList.toggle('hide',!session);if(!session)return;try{const data=await api('/api/me/programmes');const owns=data.programmes.includes('combat-strength');document.getElementById('ownership').textContent=owns?'Combat Strength Package — access granted.':'No programme entitlement yet.';document.getElementById('actions').classList.toggle('hide',!owns);document.getElementById('buy').classList.toggle('hide',owns);status(new URLSearchParams(location.search).has('checkout')?'Payment status will be verified automatically; refresh if it is still processing.':'')}catch(e){status(e.message)}}
document.getElementById('signIn').addEventListener('submit',async(e)=>{e.preventDefault();try{const email=document.getElementById('email').value.trim();const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+'/member.html'}});if(error)throw error;status('Check your email for the secure sign-in link.')}catch(e){status(e.message)}});
document.getElementById('logout').addEventListener('click',async()=>{await sb.auth.signOut();location.href='/member.html'});
document.getElementById('checkout').addEventListener('click',async()=>{try{const data=await api('/api/checkout',{method:'POST'});if(!data.url||!data.url.startsWith('https://checkout.stripe.com/'))throw Error('Unexpected payment address');location.assign(data.url)}catch(e){status(e.message)}});
document.getElementById('download').addEventListener('click',async()=>{try{const data=await api('/api/me/combat-strength/pdf',{method:'POST'});if(!data.url)throw Error('File unavailable');location.href=data.url}catch(e){status(e.message)}});
</script></body></html>
